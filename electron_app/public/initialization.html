<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始化环境 - 语义文件搜索</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            max-width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .description {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: white;
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .status {
            font-size: 14px;
            margin-top: 15px;
            opacity: 0.9;
        }
        
        .log {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
            background: rgba(0, 0, 0, 0.1);
            padding: 10px;
            border-radius: 5px;
            font-family: 'Consolas', 'Monaco', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>正在初始化环境</h1>
        <p class="description">首次运行需要创建Python虚拟环境，请耐心等待...</p>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="status" id="statusText">准备中...</div>
        <div class="log" id="logText"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        let logText = '';
        
        function updateProgress(text, progress = 0) {
            document.getElementById('statusText').textContent = text;
            document.getElementById('progressBar').style.width = progress + '%';
        }
        
        function addLog(message) {
            logText += message + '\n';
            const logElement = document.getElementById('logText');
            logElement.textContent = logText;
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        // 监听初始化事件
        ipcRenderer.on('env-initialization-start', () => {
            updateProgress('正在创建Python虚拟环境...', 10);
        });
        
        ipcRenderer.on('env-initialization-progress', (event, data) => {
            addLog(data);
            
            // 根据输出内容更新进度
            if (data.includes('Collecting')) {
                updateProgress('正在下载依赖包...', 30);
            } else if (data.includes('Installing')) {
                updateProgress('正在安装依赖...', 60);
            } else if (data.includes('Successfully')) {
                updateProgress('安装完成...', 90);
            }
        });
        
        ipcRenderer.on('env-initialization-complete', () => {
            updateProgress('环境初始化完成，正在启动应用...', 100);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        });
        
        ipcRenderer.on('env-initialization-error', (event, error) => {
            updateProgress('初始化失败: ' + error, 0);
            addLog('错误: ' + error);
            document.querySelector('.spinner').style.display = 'none';
        });
    </script>
</body>
</html>
